<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Idea Chatbot</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="m-0 h-screen bg-gray-100 font-sans">
  <main class="mx-auto flex h-full max-w-2xl flex-col gap-3 p-4">
    <section class="flex flex-col gap-3">
      <h1 class="text-2xl font-bold text-center">Game Idea Chatbot</h1>
      <div class="grid grid-cols-3 gap-3">
        <div class="rounded-md border border-gray-300 bg-white p-3">
          <h2 class="text-xs font-semibold uppercase text-gray-500">Genre</h2>
          <p id="idea-genre" class="mt-1 whitespace-pre-wrap">-</p>
        </div>
        <div class="rounded-md border border-gray-300 bg-white p-3">
          <h2 class="text-xs font-semibold uppercase text-gray-500">Setting</h2>
          <p id="idea-setting" class="mt-1 whitespace-pre-wrap">-</p>
        </div>
        <div class="rounded-md border border-gray-300 bg-white p-3">
          <h2 class="text-xs font-semibold uppercase text-gray-500">Theme</h2>
          <p id="idea-theme" class="mt-1 whitespace-pre-wrap">-</p>
        </div>
      </div>
      <div class="rounded-md border border-gray-300 bg-white p-3">
        <h2 class="text-xs font-semibold uppercase text-gray-500">Core Mechanics</h2>
        <ul id="idea-mechanics" class="mt-1 flex flex-wrap gap-x-4 gap-y-1"><li>-</li></ul>
      </div>
    </section>
    <section class="flex min-h-0 flex-1 flex-col gap-3">
    <div class="relative min-h-0 flex-1">
      <div id="output" aria-live="polite" class="flex h-full flex-col overflow-y-auto rounded-md border border-gray-300 bg-white p-2 [&>:first-child]:mt-auto"></div>
      <div id="suggestions" class="absolute inset-0 flex items-end justify-end p-2 pointer-events-none">
        <button type="button" class="suggestion pointer-events-auto rounded-full border border-blue-300 bg-blue-50 px-4 py-2 text-sm text-blue-800 hover:bg-blue-100">Give me a game idea</button>
      </div>
    </div>
    <form id="chat-form" class="flex gap-2">
      <input type="text" id="input" placeholder="Ask for a game idea..." autocomplete="off" required class="flex-1 rounded border border-gray-300 p-2">
      <button type="submit" id="send" class="rounded bg-blue-600 px-4 py-2 text-white hover:bg-blue-700 disabled:opacity-50">Send</button>
      <button type="button" id="clear" class="rounded bg-gray-200 px-4 py-2 hover:bg-gray-300">Clear</button>
    </form>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
